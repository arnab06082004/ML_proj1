<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Exam Performance Indicator</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== Body Background ===== */
    body {
      background: radial-gradient(circle at top left, #1b1f3b, #11142d 40%, #0b0f24 90%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Background Circles */
    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.6;
      z-index: 0;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: #5b7fff;
      top: -100px;
      left: -100px;
      animation: move1 8s infinite alternate ease-in-out;
    }

    body::after {
      width: 500px;
      height: 500px;
      background: #ff69b4;
      bottom: -150px;
      right: -120px;
      animation: move2 10s infinite alternate ease-in-out;
    }

    @keyframes move1 {
      from { transform: translateY(0); }
      to { transform: translateY(30px) translateX(20px); }
    }

    @keyframes move2 {
      from { transform: translateY(0); }
      to { transform: translateY(-40px) translateX(-30px); }
    }

    /* ===== Glassmorphism Card ===== */
    .container-box {
      position: relative;
      z-index: 2;
     
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1.2rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
      max-width: 780px;
      width: 90%;
      animation: fadeIn 1s ease forwards;
      transform: translateY(15px);
    }

    h1 {
      text-align: center;
      font-weight: 700;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    legend {
      color: #ffdb70;
      font-size: 1.25rem;
      font-weight: 600;
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 8px;
      margin-bottom: 1rem;
    }

    .form-label {
      color: #f1f1f1;
      font-weight: 500;
    }

    /* ===== Input and Dropdown Styling ===== */
    .form-control {
      border-radius: 0.6rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transition: 0.3s ease;
     
    }

    .form-control:focus {
      border-color: #8bc6ff;
      box-shadow: 0 0 8px #6fa8ff;
      background: rgba(255, 255, 255, 0.25);
    }

    /* Dropdown specific tweak */
    select.form-control {
      -moz-appearance: none;
      -webkit-appearance: none;
      appearance: none;
      background-image: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      color: #fff;
    }

    select.form-control option {
      background: #1f1f2e;
      color: #fff;
    }

    .form-control::placeholder {
      color: #bbb;
    }

    /* ===== Button Styling ===== */
    .btn-primary {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 50px;
      padding: 0.8rem 2.5rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
      color: #fff;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .btn-primary::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, #00c6ff, #ff69b4, #8a2be2);
      transition: all 0.5s ease;
      z-index: -1;
    }

    .btn-primary:hover::before {
      left: 0;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
    }

    /* ===== Prediction Result Box ===== */
    .alert-success {
      background: rgba(0, 255, 153, 0.2);
      border: 1px solid rgba(0, 255, 153, 0.4);
      color: #b6ffcc;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.2);
      font-size: 1.1rem;
    }

    /* ===== Animation ===== */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container-box">
    <h1>🎓 Student Exam Performance Indicator</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="post">
      <fieldset>
        <legend>Enter Student Details</legend>

        <div class="row">
          <!-- Gender -->
          <div class="col-md-6 mb-3">
            <label class="form-label" for="gender">Gender</label>
            <select class="form-control" id="gender" name="gender" required>
              <option selected disabled value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <!-- Race/Ethnicity -->
          <div class="col-md-6 mb-3">
            <label class="form-label" for="ethnicity">Race or Ethnicity</label>
            <select class="form-control" id="ethnicity" name="ethnicity" required>
              <option selected disabled value="">Select Ethnicity</option>
              <option value="group A">Group A</option>
              <option value="group B">Group B</option>
              <option value="group C">Group C</option>
              <option value="group D">Group D</option>
              <option value="group E">Group E</option>
            </select>
          </div>
        </div>

        <!-- Parental Level of Education -->
        <div class="mb-3">
          <label class="form-label" for="parental_level_of_education">Parental Level of Education</label>
          <select class="form-control" id="parental_level_of_education" name="parental_level_of_education" required>
            <option selected disabled value="">Select Education Level</option>
            <option value="associate's degree">Associate's degree</option>
            <option value="bachelor's degree">Bachelor's degree</option>
            <option value="high school">High school</option>
            <option value="master's degree">Master's degree</option>
            <option value="some college">Some college</option>
            <option value="some high school">Some high school</option>
          </select>
        </div>

        <div class="row">
          <!-- Lunch -->
          <div class="col-md-6 mb-3">
            <label class="form-label" for="lunch">Lunch Type</label>
            <select class="form-control" id="lunch" name="lunch" required>
              <option selected disabled value="">Select Lunch Type</option>
              <option value="free/reduced">Free/Reduced</option>
              <option value="standard">Standard</option>
            </select>
          </div>

          <!-- Test Preparation Course -->
          <div class="col-md-6 mb-3">
            <label class="form-label" for="test_preparation_course">Test Preparation Course</label>
            <select class="form-control" id="test_preparation_course" name="test_preparation_course" required>
              <option selected disabled value="">Select Test Course</option>
              <option value="none">None</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>

        <!-- Reading and Writing Scores -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="reading_score">Reading Score (out of 100)</label>
            <input
              class="form-control"
              type="number"
              id="reading_score"
              name="reading_score"
              placeholder="Enter your Reading Score"
              min="0"
              max="100"
              required
            />
          </div>
          <div class="col-md-6 mb-4">
            <label class="form-label" for="writing_score">Writing Score (out of 100)</label>
            <input
              class="form-control"
              type="number"
              id="writing_score"
              name="writing_score"
              placeholder="Enter your Writing Score"
              min="0"
              max="100"
              required
            />
          </div>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button class="btn btn-primary" type="submit">🔮 Predict Maths Score</button>
        </div>
      </fieldset>
    </form>

    <!-- Display the prediction result -->
    {% if results %}
      <div class="alert alert-success mt-4 text-center fw-bold" role="alert">
        🧮 Predicted Maths Score: {{ results }}
      </div>
    {% endif %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
